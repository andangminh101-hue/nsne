<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MINH AN MOD · Quản lý KEY</title><style>body{font:15px system-ui;margin:0;padding:16px;background:#111821;color:#eef3fb}main{max-width:760px;margin:auto}section{background:#1c2633;border:1px solid #354253;border-radius:12px;padding:14px;margin:12px 0}input,button{font:inherit;padding:10px;border-radius:7px;border:1px solid #455366;margin:4px 0;max-width:100%}input{background:#101720;color:#fff}button{background:#7aa2ff;color:#08111f;font-weight:700}label{display:block;margin:8px 0}.row{display:flex;gap:8px;flex-wrap:wrap}.row input{flex:1;min-width:140px}pre{white-space:pre-wrap;overflow-wrap:anywhere}.muted{color:#aab8ca}</style></head><body><main><h1>MINH AN MOD · Quản lý KEY</h1><p class="muted">Trang quản trị gọi API máy chủ. Không lưu token vào file HTML.</p><section><label>Địa chỉ Worker API<input id="api" placeholder="https://ten-worker.workers.dev" style="width:100%"></label><label>Admin token<input id="token" type="password" autocomplete="off" placeholder="Token ADMIN_TOKEN" style="width:100%"></label><button id="save">Lưu trong phiên</button> <button id="load">Tải danh sách KEY</button><p id="status" class="muted"></p></section><section><h2>Tạo KEY</h2><label>Nhãn người dùng (tuỳ chọn)<input id="label" placeholder="Ví dụ: khách 01" style="width:100%"></label><label>Số ngày hiệu lực<input id="days" type="number" min="1" max="3650" value="30"></label><button id="create">Tạo KEY</button><pre id="created"></pre></section><section><h2>Danh sách KEY</h2><div id="list" class="muted">Chưa tải dữ liệu.</div></section></main><script>let api='',token='';const $=id=>document.getElementById(id);function status(s){$('status').textContent=s}async function call(path,opts={}){if(!api||!token)throw Error('Nhập API và admin token trước.');let r=await fetch(api.replace(/\/$/,'')+path,{...opts,headers:{'Content-Type':'application/json','Authorization':'Bearer '+token,...(opts.headers||{})}});let d=await r.json();if(!r.ok||!d.ok)throw Error(d.message||'Lỗi API');return d}$('save').onclick=()=>{api=$('api').value.trim();token=$('token').value.trim();status('Đã lưu trong bộ nhớ của trang hiện tại.');};$('create').onclick=async()=>{try{const d=await call('/admin/create',{method:'POST',body:JSON.stringify({days:Number($('days').value),label:$('label').value})});$('created').textContent='KEY: '+d.key+'\nHết hạn: '+new Date(d.record.expiresAt).toLocaleString();status('Tạo KEY thành công. Hãy sao chép và gửi cho người dùng.');await loadList()}catch(e){status(e.message)}};async function loadList(){try{const d=await call('/admin/list');$('list').innerHTML='';if(!d.items.length){$('list').textContent='Chưa có KEY.';return}d.items.forEach(x=>{const div=document.createElement('div');div.style.cssText='padding:10px 0;border-bottom:1px solid #354253;overflow-wrap:anywhere';const p=document.createElement('p');p.textContent=x.key+' · '+(x.label||'Không nhãn')+' · '+(x.revoked?'ĐÃ THU HỒI':(x.expiresAt&&Date.now()>x.expiresAt?'HẾT HẠN':'Hoạt động'))+' · hết hạn '+new Date(x.expiresAt).toLocaleString()+' · '+(x.deviceId?'đã kích hoạt':'chưa kích hoạt');div.appendChild(p);if(!x.revoked){const b=document.createElement('button');b.textContent='Thu hồi';b.onclick=async()=>{if(!confirm('Thu hồi '+x.key+'?'))return;try{await call('/admin/revoke',{method:'POST',body:JSON.stringify({key:x.key})});await loadList();status('Đã thu hồi KEY.')}catch(e){status(e.message)}};div.appendChild(b)}$('list').appendChild(div)})}catch(e){status(e.message)}}$('load').onclick=loadList;</script></body></html>
